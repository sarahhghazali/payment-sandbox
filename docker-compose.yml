services:
  app:
    build: .
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: payment_sandbox
      DB_USERNAME: sandbox
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # The callbacks are delivered by this worker, not by the web request.
  queue:
    build: .
    command: php artisan queue:work --tries=5 --timeout=30
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: payment_sandbox
      DB_USERNAME: sandbox
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: payment_sandbox
      MYSQL_USER: sandbox
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:alpine

volumes:
  mysql-data:
